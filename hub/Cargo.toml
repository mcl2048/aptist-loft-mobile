[package]
name = "loft-hub"
version = "0.1.4"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22.1"
html2text = "0.17.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
url = "2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3.31"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["AbortController", "Crypto", "CryptoKey", "SubtleCrypto"] }
worker = { version = "=0.9.0", features = ["d1"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
